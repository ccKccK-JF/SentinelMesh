name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  cpp-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S agent -B build/agent -DSENTINEL_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/agent --parallel
      - name: Test
        run: ctest --test-dir build/agent --output-on-failure
